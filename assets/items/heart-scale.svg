<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Heart Scale outline -->
  <rect x="3" y="2" width="3" height="1" fill="#1b2432"/><rect x="10" y="2" width="3" height="1" fill="#1b2432"/>
  <rect x="2" y="3" width="1" height="4" fill="#1b2432"/><rect x="13" y="3" width="1" height="4" fill="#1b2432"/>
  <rect x="6" y="3" width="4" height="1" fill="#1b2432"/>
  <rect x="3" y="7" width="1" height="2" fill="#1b2432"/><rect x="12" y="7" width="1" height="2" fill="#1b2432"/>
  <rect x="4" y="9" width="1" height="2" fill="#1b2432"/><rect x="11" y="9" width="1" height="2" fill="#1b2432"/>
  <rect x="5" y="11" width="1" height="1" fill="#1b2432"/><rect x="10" y="11" width="1" height="1" fill="#1b2432"/>
  <rect x="6" y="12" width="1" height="1" fill="#1b2432"/><rect x="9" y="12" width="1" height="1" fill="#1b2432"/>
  <rect x="7" y="13" width="2" height="1" fill="#1b2432"/>
  <!-- Pearlescent pink heart scale body -->
  <rect x="3" y="3" width="3" height="4" fill="#ff8db5"/>
  <rect x="10" y="3" width="3" height="4" fill="#f06292"/>
  <rect x="6" y="4" width="4" height="5" fill="#f779a4"/>
  <rect x="4" y="7" width="8" height="2" fill="#f06292"/>
  <rect x="5" y="9" width="6" height="2" fill="#e04f80"/>
  <rect x="6" y="11" width="4" height="1" fill="#cf3c6e"/>
  <rect x="7" y="12" width="2" height="1" fill="#cf3c6e"/>
  <!-- Scale sheen highlight -->
  <rect x="4" y="4" width="2" height="2" fill="#ffd9e8"/>
  <rect x="5" y="5" width="1" height="1" fill="#ffffff"/>
</svg>
